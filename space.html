<!doctype html>
<html>
  <head>
    <title>SPS Private Space</title>
    <link rel="stylesheet" href="style.css" />
  </head>

  <body onload="protectSpace()">
    <div class="container">
      <h1>Private Space</h1>

      <p>Your private notes.</p>

      <textarea id="note" placeholder="Write something private..."></textarea>

      <br />

      <button onclick="saveNote()">Save</button>

      <button onclick="lockSPS()">Lock SPS</button>
    </div>

    <script src="app.js"></script>
  </body>
</html>
